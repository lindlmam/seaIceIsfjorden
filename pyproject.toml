[tool.poetry]
name = "seaicetimeseries"
version = "0.1.0"
description = "create sea ice time series of isfjorden (svalbard)"
authors = ["Martin Lindlmayer <martin.li3107@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
black = "^24.10.0"
numpy = "^2.1.3"
pandas = "^2.2.3"
requests = "^2.32.3"
beautifulsoup4 = "^4.12.3"
pillow = "^11.0.0"
pyproj = "^3.7.0"
matplotlib = "^3.9.2"
pyqt6 = "^6.8.1"
scipy = "^1.15.2"
cartopy = "^0.24.1"
netcdf4 = "^1.7.2"
h5netcdf = "^1.6.1"
geopy = "^2.4.1"
seaborn = "^0.13.2"
gsw = "^3.6.19"
gsw-xarray = "^0.4.0"
shapely = "^2.1.0"
cmocean = "^4.0.3"
dask = "^2026.1.2"


[tool.poetry.group.dev.dependencies]
ipykernel = "^6.29.5"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
